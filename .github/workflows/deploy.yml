name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
          -name: Install de dendencies
          run: npm install --no-package-lock

      - name: Build
        run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.AIzaSyD1JORJyRmr5tLM2xsQx5nLsGOnjwwHY_s }} # Para que tu App Script/Gemini funcione

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
